[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yee"
version = "4.2.0"
description = "Yee (formerly recall-accel): Recall copy-draft accelerator for SGLang (DSPARK/DFLASH/EAGLE/EAGLE3/MTP/STANDALONE/UNO/NGRAM), vLLM V2 (DSpark/DFlash/EAGLE/MTP), TensorFold, cuteafd and mlx-serve, with a built-in manual; vLLM production adapter vllm_d_recall with KAD per-request adaptive K (K_max 12) for every vLLM draft head; 3.2.0 extends KAD to SGLang, llama.cpp, TensorRT-LLM, mlx-lm, transformers, TensorFold and mlx-serve; 3.3.0 adds the llama.cpp recall patch (llama.cpp-recall); 3.5.0 adds the vllm_d_recall shadow / threshold / nongreedy build and the two SGLang Mia patches (mia-dsv41-vcap, mia-dsv41-image-budget); 3.5.1 adds the strata engine recall patch (strata-recall); 3.5.2 adds the llama.cpp MTP draft-head vocab patch (llama.cpp-mtp-vocab) and the mtp_bench tools; 3.6.0 lets several processes share one disk record directory (RECALL_ACCEL_SHARED) and carries the same fix in strata-recall; 3.7.0 adds the question-hash index (qhash): a new request whose prompt (or its last 512/128/32 ids) matches a finished one drafts from that reply from its first token; 3.8.0 adds the vcap width selector shadow mode (mia-dsv41-vcap, control file mode width: per-step best verify width estimate, stats only) and yee.tools.vcap_width_report; 3.9.0 adds the decode step breakdown tool (yee.tools.step_breakdown: split torch profiler chrome traces into decode steps and report wall / GPU busy / communication / compute per rank) and changes no runtime parameter; 4.0.0 adds a recall-aware verify budget for DSpark compact verify (rank0 treats pool rows that carried a recall plan in the latest step as certain in HostConfidenceBudgetPlanner.compute_budget, YEE_RECALL_BUDGET=0 turns it off) and an STS label collector that works under folded proposals (YEE_STS_COLLECT_PATH, recall rows skipped); 4.1.0 adds a hot-expert verify budget for the DSV4.1 routed MoE on moe_b12x_next (yee.integrations.expert_budget: per MoE call keep the hottest experts covering p of the step's routing weight, live control file with call-index synchronized switching); 4.2.0 turns every accelerator on by default, adds a cross-rank version check, `yee config` and the one-click installer install.sh"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
keywords = ["llm", "speculative-decoding", "recall", "sglang", "vllm", "tensorfold", "cuteafd", "mlx-serve", "dspark", "dflash", "eagle", "mtp", "kad", "llama.cpp", "tensorrt-llm", "lmdeploy", "mlx-lm", "transformers"]
dependencies = ["numpy"]

[project.optional-dependencies]
torch = ["torch"]

[project.scripts]
yee = "yee.__main__:main"
recall-accel = "yee.__main__:main"

[tool.setuptools]
packages = ["yee", "yee.integrations", "yee.selftests", "recall_accel", "vllm_d_recall", "vllm_d_recall.integrations", "yee.tools", "yee.tools.mtp_bench"]
include-package-data = true

[tool.setuptools.package-data]
yee = ["docs/*.md", "patches/*", "patches/**/*", "tools/mtp_bench/*"]

[tool.pytest.ini_options]
# the test files define a ``test(fn)`` decorator helper; only test_* functions are tests
python_functions = ["test_*"]
