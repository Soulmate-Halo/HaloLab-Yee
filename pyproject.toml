[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yee"
version = "4.3.0"
description = "Yee: recall copy-draft and per-request adaptive draft (KAD) accelerator for LLM serving (SGLang, vLLM V2, llama.cpp, TensorRT-LLM, LMDeploy, mlx-lm, transformers, TensorFold, cuteafd, mlx-serve, strata, Project Maya); 4.3.0 adds yee doctor deployment diagnosis for 15 engines (process / docker / ssh / K8s / URL), runtime plan and effect notices, a generic installer mode and the maya-recall patch; every accelerator is on by default"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
keywords = ["llm", "speculative-decoding", "recall", "sglang", "vllm", "tensorfold", "cuteafd", "mlx-serve", "dspark", "dflash", "eagle", "mtp", "kad", "llama.cpp", "tensorrt-llm", "lmdeploy", "mlx-lm", "transformers"]
dependencies = ["numpy"]

[project.optional-dependencies]
torch = ["torch"]

[project.scripts]
yee = "yee.__main__:main"
recall-accel = "yee.__main__:main"

[tool.setuptools]
packages = ["yee", "yee.integrations", "yee.selftests", "recall_accel", "vllm_d_recall", "vllm_d_recall.integrations", "yee.tools", "yee.tools.mtp_bench"]
include-package-data = true

[tool.setuptools.package-data]
yee = ["docs/*.md", "patches/*", "patches/**/*", "tools/mtp_bench/*"]

[tool.pytest.ini_options]
# the test files define a ``test(fn)`` decorator helper; only test_* functions are tests
python_functions = ["test_*"]
